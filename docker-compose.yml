services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PROJECT_ROOT: /work
    volumes:
      - ./data:/work/data
      - ./logs:/work/logs
      - ./outputs:/work/outputs
      - ./uploads:/work/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
